# Code scanning: looks in the C and C++ code of NXDock (the network, the parsers of containers,
# JSON and MTP) and in the Go of the release tools for the usual mistakes that open a program to
# attacks, on every change and every week. The findings are in the Security tab of the repository.
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 3"

permissions:
  contents: read

jobs:
  c-cpp:
    name: Analyze (c-cpp)
    runs-on: ubuntu-24.04
    # code scanning needs the repository to be public (or GitHub Advanced Security): while it is
    # private, the results cannot be uploaded and the job would only fail
    if: ${{ !github.event.repository.private }}
    # the compiler of the console, so CodeQL sees the code as it is built for it
    container: devkitpro/devkita64:latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the loader of the HOME menu shortcut first: npdmtool cannot read its JSON under CodeQL's
      # tracer, and the loader is not NXDock's own code
      - name: Build the shortcut loader
        run: |
          /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target hbl_nso hbl_npdm
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        run: |
          /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:c-cpp

  go:
    name: Analyze (go)
    runs-on: ubuntu-24.04
    # code scanning needs the repository to be public (or GitHub Advanced Security): while it is
    # private, the results cannot be uploaded and the job would only fail
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
          build-mode: manual
      - name: Build
        run: go build ./tools/...
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:go
